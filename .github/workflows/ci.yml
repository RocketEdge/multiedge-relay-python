name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
          # Adds `core-only` to the EXISTING ubuntu/3.14 job rather than creating a
          # sixth one — an include whose matrix keys match a combination merges into
          # it. That job therefore runs the suite twice: once with every extra, then
          # again without the crypto one (final step).
          - os: ubuntu-latest
            python-version: "3.14"
            core-only: true
    steps:
      - uses: actions/checkout@v7

      # Exact tag, not @v10: astral-sh stopped publishing bare major aliases after v7.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type check (mypy --strict)
        run: uv run mypy --strict src

      - name: Tests
        run: uv run pytest -m "not integration" --cov=multiedge_relay --cov-report=term-missing

      # Proves sealed mode never became a hard dependency: core must import and the
      # suite must stay green with `cryptography` genuinely absent (sealed tests
      # importorskip out, so the passed count DROPS — that drop is the evidence the
      # check ran). --no-sync is load-bearing: `cryptography` is in the dev GROUP, so
      # a plain `uv run` re-syncs it back before the first assertion and the check
      # silently proves nothing. Runs last so this job also covers the full extras.
      - name: Core stays green without the crypto extra
        if: matrix.core-only
        run: |
          uv pip uninstall cryptography
          uv run --no-sync python -c "import multiedge_relay; print(multiedge_relay.__version__)"
          uv run --no-sync pytest -m "not integration" -q
