name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
          # Core must stay importable and green WITHOUT the crypto extra —
          # proves sealed mode never became a hard dependency.
          - os: ubuntu-latest
            python-version: "3.14"
            core-only: true
    steps:
      - uses: actions/checkout@v7

      # Exact tag, not @v10: astral-sh stopped publishing bare major aliases after v7.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync

      - name: Remove crypto dependency (core-only job)
        if: matrix.core-only
        run: uv pip uninstall cryptography

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type check (mypy --strict)
        run: uv run mypy --strict src

      - name: Tests
        run: uv run pytest -m "not integration" --cov=multiedge_relay --cov-report=term-missing
