[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiedge-relay"
version = "0.7.1"
description = "Official Python SDK for MultiEdge Signal Relay — auditable signal-distribution infrastructure, not execution."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "MultiEdge.ai" }]
keywords = ["signals", "trading-signals", "distribution", "sdk", "multiedge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
webpubsub = ["azure-messaging-webpubsubclient>=1.0"]
sealed = ["cryptography>=47"]

[project.urls]
Homepage = "https://multiedge.ai"
Documentation = "https://github.com/RocketEdge/multiedge-relay-python#readme"
Repository = "https://github.com/RocketEdge/multiedge-relay-python"
Changelog = "https://github.com/RocketEdge/multiedge-relay-python/blob/main/CHANGELOG.md"

[project.scripts]
multiedge = "multiedge_relay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "cryptography>=47",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multiedge_relay"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
# The webpubsub live transport is an optional extra; its import is lazy and guarded.
module = "azure.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live relay endpoint and credentials",
]
filterwarnings = [
    "error::DeprecationWarning:multiedge_relay.*",
]
